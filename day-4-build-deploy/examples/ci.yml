# Example pipeline: Test -> Snyk -> ZAP -> Build & Push image to GHCR.
# Copy to .github/workflows/ci.yml in YOUR project repo (not this course repo).
# Required repo secret: SNYK_TOKEN (Settings > Secrets and variables > Actions).
# Assumes project layout from Day 3: backend/ (with node-pg-migrate "migrate" script), frontend/,
# docker-compose.yml, .env.example.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: test
          POSTGRES_DB: appdb_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d appdb_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://app:test@localhost:5432/appdb_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Backend migrations + tests
        working-directory: backend
        run: |
          npm ci
          npm run migrate up
          npm test
      - name: Frontend tests
        working-directory: frontend
        run: |
          npm ci
          npm test

  snyk:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm ci
        working-directory: ${{ matrix.project }}
      - name: Snyk dependency scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=${{ matrix.project }}/package.json

  zap:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start app
        run: |
          cp .env.example .env
          docker compose up -d --build --wait
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:5173
          # rules_file_name: .zap/rules.tsv
          allow_issue_writing: false
      - name: Stop app
        if: always()
        run: docker compose down -v

  build-push:
    needs: [snyk, zap]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.component }}
          tags: |
            type=sha
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
